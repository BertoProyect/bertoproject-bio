<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BertoProject</title>
  <meta name="description" content="BertoProject — Cambiando mi vida en menos de un año. TikTok, Instagram, YouTube y Órbita Webs.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://bertoproject.com/">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="BertoProject">
  <meta property="og:description" content="Cambiando mi vida en menos de un año.">
  <meta property="og:image" content="https://bertoproject.com/og.jpg">
  <meta property="og:url" content="https://bertoproject.com/">
  <meta name="twitter:card" content="summary">

  <link rel="preload" href="/avatar.webp" as="image" type="image/webp">

  <style>
    /* Tokens — sistema de diseño de Apple (awesome-design-md/apple) */
    :root {
      --canvas: #f5f5f7;          /* parchment */
      --card: #ffffff;
      --icon-bg: #f5f5f7;
      --hairline: rgba(0, 0, 0, .08);
      --ink: #1d1d1f;
      --ink-secondary: #424245;
      --ink-muted: #6e6e73;
      --ink-faint: #86868b;
      --blue: #0066cc;            /* Action Blue */
      --focus: #0071e3;

      --r-lg: 18px;
      --r-icon: 11px;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #000000;
        --card: #1d1d1f;
        --icon-bg: #2a2a2c;
        --hairline: rgba(255, 255, 255, .08);
        --ink: #f5f5f7;
        --ink-secondary: #d2d2d7;
        --ink-muted: #a1a1a6;
        --ink-faint: #86868b;
        --blue: #2997ff;          /* Sky Link Blue, para fondos oscuros */
        --focus: #2997ff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--canvas);
      color: var(--ink);
      font: 400 17px/1.47 var(--text);
      letter-spacing: -0.374px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: calc(64px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* Cabecera */
    header { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .avatar {
      width: 112px; height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card);
    }
    h1 {
      margin: 24px 0 0;
      font: 600 34px/1.1 var(--display);
      letter-spacing: -0.6px;
    }
    .handle { margin: 6px 0 0; font-size: 14px; line-height: 1.43; letter-spacing: -0.224px; color: var(--ink-muted); }
    .tagline { margin: 16px 0 0; color: var(--ink-secondary); max-width: 32ch; text-wrap: balance; }

    /* Secciones */
    section { display: flex; flex-direction: column; gap: 12px; }
    .section-title {
      margin: 0 0 0 4px;
      font: 600 14px/1.29 var(--text);
      letter-spacing: -0.224px;
      color: var(--ink-muted);
    }

    /* Enlaces: tarjeta de utilidad de Apple (radio 18px, borde fino, sin sombra) */
    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 68px;
      padding: 12px 16px 12px 12px;
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      color: var(--ink);
      text-decoration: none;
      transition: transform .2s cubic-bezier(.25, .1, .25, 1);
      -webkit-tap-highlight-color: transparent;
    }
    .link:active { transform: scale(.97); }
    .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .icon {
      flex: none;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: var(--r-icon);
      background: var(--icon-bg);
      color: var(--ink);
    }
    .icon svg { width: 22px; height: 22px; }

    .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .label { font-weight: 600; line-height: 1.24; }
    .sub { margin-top: 2px; font-size: 14px; line-height: 1.43; letter-spacing: -0.224px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .chevron { flex: none; width: 9px; height: 15px; color: var(--blue); }

    footer { text-align: center; font-size: 12px; line-height: 1; letter-spacing: -0.12px; color: var(--ink-faint); }

    @media (hover: hover) {
      .link { transition: transform .2s cubic-bezier(.25, .1, .25, 1), border-color .2s ease; }
      .link:hover { border-color: color-mix(in srgb, var(--ink) 18%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="avatar" src="/avatar.webp" width="112" height="112" alt="BertoProject">
      <h1>BertoProject</h1>
      <p class="handle">@berto.project</p>
      <p class="tagline">Cambiando mi vida en menos de un año.</p>
    </header>

    <!--
      ENLACES
      Cada botón apunta a una ruta corta (/tiktok, /ig, /yt, /orbita).
      Los destinos reales están en public/_redirects.
    -->
    <section aria-label="Redes">
      <a class="link" href="/tiktok">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        </span>
        <span class="text"><span class="label">TikTok</span><span class="sub">@berto.project</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link" href="/ig">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="text"><span class="label">Instagram</span><span class="sub">@berto.project</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link" href="/yt">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
        </span>
        <span class="text"><span class="label">YouTube</span><span class="sub">@BertoProjectt</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <section aria-labelledby="negocio">
      <h2 class="section-title" id="negocio">Mi negocio</h2>
      <a class="link" href="/orbita">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        </span>
        <span class="text"><span class="label">Órbita Webs</span><span class="sub">orbitawebs.com</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <footer>© 2026 BertoProject</footer>
  </main>
</body>
</html>
