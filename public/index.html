<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BertoProject</title>
  <meta name="description" content="BertoProject — TikTok, Instagram, YouTube y Órbita Webs.">
  <!-- Solo modo claro: "only" evita que el navegador oscurezca la página por su cuenta -->
  <meta name="color-scheme" content="only light">
  <meta name="supported-color-schemes" content="light">
  <meta name="theme-color" content="#f5f5f7">
  <!-- Iconos: pestaña, Google, iPhone, Android -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/icon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="BertoProject">
  <meta name="application-name" content="BertoProject">
  <!-- Nombre del sitio en los resultados de Google -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"BertoProject","url":"https://bertoproject.com/"}</script>
  <link rel="canonical" href="https://bertoproject.com/">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="BertoProject">
  <meta property="og:description" content="TikTok, Instagram, YouTube y Órbita Webs.">
  <meta property="og:image" content="https://bertoproject.com/og.jpg">
  <meta property="og:url" content="https://bertoproject.com/">
  <meta name="twitter:card" content="summary">

  <link rel="preload" href="/avatar.webp" as="image" type="image/webp">

  <style>
    /* Tokens — sistema de diseño de Apple (awesome-design-md/apple) + azul BertoProject */
    :root {
      --canvas: #f5f5f7;
      --card: #ffffff;
      --icon-bg: #f5f5f7;
      --hairline: rgba(0, 0, 0, .08);
      --ink: #1d1d1f;
      --ink-muted: #6e6e73;            /* 4.66:1 sobre el fondo */

      --brand: #00a3ff;                /* azul BertoProject: el único azul de la página */
      --brand-tint: rgba(0, 163, 255, .12);

      --r-lg: 18px;
      --r-icon: 11px;
      --ease-out: cubic-bezier(.16, 1, .3, 1);   /* expo out */
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    :root, html, body { color-scheme: only light; }
    html { -webkit-text-size-adjust: 100%; background: #f5f5f7; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--canvas);
      color: var(--ink);
      font: 400 17px/1.47 var(--text);
      letter-spacing: -0.374px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: calc(64px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* Botón de compartir: control circular de Apple (44×44) en la esquina superior derecha */
    main { position: relative; }
    .share {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      padding: 0;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      background: var(--card);
      color: var(--brand);
      cursor: pointer;
      transition: transform .25s var(--ease-out), color .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .share svg { width: 20px; height: 20px; margin-top: -2px; }
    .share:active { transform: scale(.92); border-color: var(--brand); }
    .share:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    @media (hover: hover) { .share:hover { border-color: color-mix(in srgb, var(--brand) 45%, transparent); } }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      padding: 10px 18px;
      border-radius: 9999px;
      background: var(--ink); color: var(--canvas);
      font-size: 14px; letter-spacing: -0.224px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .35s var(--ease-out);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Cabecera */
    header { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .avatar {
      width: 112px; height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card);
      box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5.5px var(--ink);
    }
    h1 {
      margin: 26px 0 0;
      font: 600 34px/1.1 var(--display);
      letter-spacing: -0.6px;
      text-wrap: balance;
    }
    .handle { margin: 6px 0 0; font-size: 14px; line-height: 1.43; letter-spacing: -0.224px; color: var(--ink-muted); }

    /* Secciones */
    section { display: flex; flex-direction: column; gap: 12px; }
    .section-title {
      margin: 0 0 0 4px;
      font: 600 14px/1.29 var(--text);
      letter-spacing: -0.224px;
      color: var(--ink-muted);
    }

    /* Enlaces: tarjeta de utilidad de Apple (radio 18px, borde fino, sin sombra) */
    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 68px;
      padding: 12px 18px 12px 12px;
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      color: var(--ink);
      text-decoration: none;
      transition: transform .25s var(--ease-out), border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:active { transform: scale(.97); border-color: var(--brand); }
    .link:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

    .icon {
      flex: none;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: var(--r-icon);
      background: var(--icon-bg);
      color: var(--ink);
      transition: background-color .2s ease, color .2s ease;
    }
    .icon svg { width: 24px; height: 24px; }
    .link:active .icon { background: var(--brand-tint); color: var(--brand); }

    /* Logo de Órbita: silueta del logo original, del color del icono */
    .logo-orbita {
      width: 26px; height: 26px;
      background: currentColor;
      -webkit-mask: url(/orbita-logo.png) center / contain no-repeat;
      mask: url(/orbita-logo.png) center / contain no-repeat;
    }

    .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .label { font-weight: 600; line-height: 1.24; }
    .sub { margin-top: 2px; font-size: 14px; line-height: 1.43; letter-spacing: -0.224px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .chevron { flex: none; width: 9px; height: 15px; color: var(--brand); transition: transform .25s var(--ease-out); }

    footer { text-align: center; font-size: 12px; line-height: 1; letter-spacing: -0.12px; color: var(--ink-muted); }

    @media (hover: hover) {
      .link:hover { border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
      .link:hover .icon { background: var(--brand-tint); color: var(--brand); }
      .link:hover .chevron { transform: translateX(3px); }
    }

    /* Entrada: la cabecera y los enlaces aparecen en cascada */
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation: rise .7s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .link, .icon, .chevron { transition: none; }
      .link:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <button class="share rise" style="--i:0" type="button" aria-label="Compartir esta página">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M8 10.5H6.5A1.5 1.5 0 0 0 5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>
    </button>
    <header>
      <img class="avatar rise" style="--i:0" src="/avatar.webp" width="112" height="112" alt="BertoProject">
      <h1 class="rise" style="--i:1">BertoProject</h1>
      <p class="handle rise" style="--i:2">@berto.project</p>
    </header>

    <!--
      ENLACES
      Cada botón apunta a una ruta corta (/tiktok, /ig, /yt, /orbita).
      Los destinos reales están en public/_redirects.
    -->
    <section aria-label="Redes">
      <a class="link rise" style="--i:3" href="/tiktok">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        </span>
        <span class="text"><span class="label">TikTok</span><span class="sub">@berto.project</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link rise" style="--i:4" href="/ig">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="1.6" y="1.6" width="20.8" height="20.8" rx="6"/><circle cx="12" cy="12" r="5"/><circle cx="18" cy="6" r="1.45" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="text"><span class="label">Instagram</span><span class="sub">@berto.project</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link rise" style="--i:5" href="/yt">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
        </span>
        <span class="text"><span class="label">YouTube</span><span class="sub">@BertoProjectt</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <section aria-labelledby="negocio">
      <h2 class="section-title rise" style="--i:6" id="negocio">Mi negocio</h2>
      <a class="link rise" style="--i:7" href="/orbita">
        <span class="icon" aria-hidden="true">
          <span class="logo-orbita"></span>
        </span>
        <span class="text"><span class="label">Órbita Webs</span><span class="sub">orbitawebs.com</span></span>
        <svg class="chevron" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <footer class="rise" style="--i:8">© 2026 BertoProject</footer>
    <div class="toast" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var btn = document.querySelector('.share');
      var toast = document.querySelector('.toast');
      var timer;
      function avisar(texto) {
        toast.textContent = texto;
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
      }
      btn.addEventListener('click', function () {
        var url = location.origin + '/';
        var datos = { title: 'BertoProject', url: url };
        if (navigator.share) {
          navigator.share(datos).catch(function () {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function () { avisar('Enlace copiado'); },
                                                  function () { window.prompt('Copia el enlace:', url); });
        } else {
          window.prompt('Copia el enlace:', url);
        }
      });
    })();
  </script>
</body>
</html>
